[package]
name = "flotop"
version = "0.1.0"
edition = "2024"
description = "Agentless multi-host TUI for triaging your fleet of VPSes when something breaks at 2am. CPU, memory, disk, network, Docker containers, and Docker Swarm at a glance — across all your boxes over SSH. (Formerly sitrep.)"
license = "MIT"
repository = "https://github.com/rshzrh/flotop"
homepage = "https://github.com/rshzrh/flotop"
readme = "README.md"
keywords = ["monitoring", "diagnostics", "terminal", "devops", "tui"]
categories = ["command-line-utilities", "os"]

[lib]
name = "flotop"
path = "src/lib.rs"

[[bin]]
name = "flotop"
path = "src/main.rs"

[dependencies]
chrono = "0.4.43"
crossterm = "0.29.0"
sysinfo = "0.38.1"
bollard = "0.18"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
russh = "0.45"
async-trait = "0.1"
shell-escape = "0.1"
parking_lot = "0.12"

[dev-dependencies]
insta = "1"
tempfile = "3"
anyhow = "1"
russh-keys = "0.45"
